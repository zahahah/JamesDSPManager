name: Pixel effect-bound-control-v1 test module ZIP

on:
  push:
    branches: [pixel-test-new-aidl]
    paths:
      - '.github/workflows/pixel-test-native-control-v3.yml'
      - 'NATIVE-CONTROL.md'
      - 'README.md'
      - 'changelog.md'
      - 'common/**'
      - 'native-control/**'
      - 'tests/**'
      - 'tools/**'
      - '*.sh'
      - 'module.prop'
      - 'update.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-effect-bound-control-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.ref == 'refs/heads/pixel-test-new-aidl'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the candidate branch and baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run host tests
        run: python3 -m unittest discover -s tests -v
      - name: Check shell syntax
        run: |
          for file in *.sh common/*.sh; do
            sh -n "$file" || exit 1
          done
      - name: Build and verify the pinned effect-bound test ZIP
        run: python3 tools/package_6511_pixel_native_control_v3.py
      - name: Verify ZIP checksum
        working-directory: dist
        run: sha256sum -c JamesDSPManager-v6.5.14-effect-bound-control-v1-test.zip.sha256
      - name: Upload test ZIP and provenance as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: JamesDSPManager-pixel-effect-bound-control-v1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/JamesDSPManager-v6.5.14-effect-bound-control-v1-test.zip
            dist/JamesDSPManager-v6.5.14-effect-bound-control-v1-test.zip.sha256
            dist/JamesDSPManager-v6.5.14-effect-bound-control-v1-test.zip.json
