name: Global native control source and package
on:
  push:
    branches: [pixel-test-new-aidl, samsung-test-new-aidl, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Host regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: for file in *.sh common/*.sh; do sh -n "$file"; done
      - name: Check compiled candidate readiness (source-only is not a release)
        id: native
        run: |
          if [ -f native-control/v6-candidate.json ]; then
            python3 tools/package_native_control_v6.py --check-source
          elif [ -f native-control/v5-candidate.json ]; then
            python3 tools/package_native_control_v5.py --check-source
          else
            python3 tools/package_native_control_v4.py --check-source
          fi
      - name: Package only a fully imported and verified candidate
        if: steps.native.outputs.ready == 'true'
        run: |
          if [ -f native-control/v6-candidate.json ]; then
            python3 tools/package_native_control_v6.py
          elif [ -f native-control/v5-candidate.json ]; then
            python3 tools/package_native_control_v5.py
          else
            python3 tools/package_native_control_v4.py
          fi
      - uses: actions/upload-artifact@v4
        if: steps.native.outputs.ready == 'true'
        with:
          name: JamesDSPManager-native-control-${{ github.sha }}
          if-no-files-found: error
          path: dist/JamesDSPManager-v6.6-beta-*.zip*
